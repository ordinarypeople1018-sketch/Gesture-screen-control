name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest project zip
        run: |
          ZIP=$(ls GestureControl*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: GestureControl
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GestureControl-apk
          path: GestureControl/app/build/outputs/apk/debug/app-debug.apk
